name: manus_trial_app
description: "A Manus-inspired Flutter chat trial app."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.9.0

dependencies:
  connectivity_plus: ^6.1.5
  dio: ^5.11.1
  file_picker: ^13.1.0
  flutter:
    sdk: flutter
  flutter_markdown_plus: ^1.0.12
  flutter_riverpod: ^2.6.1
  flutter_svg: ^2.3.0
  go_router: ^17.5.0
  hive_ce_flutter: ^2.3.4
  image_picker: ^1.2.4
  markdown: ^7.3.1
  path_provider: ^2.1.6
  speech_to_text: ^7.4.0
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/connectors/
    - assets/icons/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
